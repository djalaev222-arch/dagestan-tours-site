<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23241b13'/%3E%3Ctext x='50' y='63' font-size='40' text-anchor='middle' fill='%23f4c9a0' font-family='Georgia, serif'%3E%D0%A2%D0%94%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Тропы Дагестана — туры по горам, каньонам и древним городам Дагестана с гидами из местных сёл."
    />
    <title>Тропы Дагестана — туры по Дагестану с местными гидами</title>
  </head>
  <body>
    <script type="text/javascript">
      // Restore the real path after the 404.html SPA redirect (see public/404.html).
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
